name: Performance issue
description: Report slow ingest, storage, or query behavior
labels: ["performance"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Dataset size, schema, command, query, and environment.
    validations:
      required: true
  - type: textarea
    id: measurement
    attributes:
      label: Measurement
      description: Timings, profiles, benchmark output, or resource usage.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Performance
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: Link to reproducible data or generated benchmark output if possible.
